# Structured Vibe canonical model registry.
#
# Structured Vibe owns the canonical model-to-tier mapping. This file is
# installed as managed runtime data. There is no supported user override
# mechanism in v1; persistent customization belongs in a future design, not in
# local edits to this file.
#
# MATCHING
#
# Alias matching is EXACT. Structured Vibe never infers model identity from
# substring similarity, regular expressions, or guessed provider naming
# conventions. An identifier that matches no alias is "unknown".
#
# "unknown" is not a tier. It is the state produced when the registry cannot
# map the current model, and it produces a visible warning rather than a
# block.
#
# TIERS
#
#   A  High reasoning.       Ambiguous product design, architecture, difficult
#                            tradeoffs, adversarial specification review.
#   B  Strong engineering.   Decomposition, JIT finalization, complex
#                            implementation, difficult debugging, verification.
#   C  Cost-efficient.       Sufficiently specified implementation, mechanical
#                            refactors, test scaffolding, repetitive changes.
#
# TIERING POLICY
#
# Tiers are assigned only where a vendor's own naming encodes a defensible
# capability ladder, such as opus > sonnet > haiku, or pro > base > mini >
# nano. Models whose relative capability cannot be asserted honestly are
# deliberately omitted; they resolve to unknown, warn, and continue.
#
# Tiers are advisory. They guide routing and warn about risk. They are not
# authorization and never revoke the ability to run a model.
#
# These assignments are hypotheses to be corrected by dogfooding, not
# permanent law.

version: 1

