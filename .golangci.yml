version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive

  settings:
    errcheck:
      # Writes to stdout/stderr are the CLI's output path. A failed write to a
      # closed pipe is not something svibe can meaningfully recover from, and
      # checking every Fprintf would bury the logic in noise.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
