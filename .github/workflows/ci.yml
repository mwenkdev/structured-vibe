name: CI

# This workflow is the repository's required validation contract.
# The release workflow verifies that this succeeded for the exact release
# commit before packaging anything (docs/specs/releasing.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The OpenCode integration is part of the managed runtime payload, so it
      # must be built before the managed manifest is generated or verified.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/opencode/package-lock.json

      - name: build opencode integration
        run: make plugin

      - name: typecheck opencode integration
        run: make plugin-typecheck

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      # Pinned, and matching GOLANGCI_VERSION in the Makefile. The v2 config
      # schema in .golangci.yml is rejected by golangci-lint v1, so an
      # unpinned action version silently breaks CI while local runs pass.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

      - name: test
        run: make test

      - name: generated files are current
        run: make generate-check

      - name: build
        run: make build

  build-matrix:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: cross build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/svibe
