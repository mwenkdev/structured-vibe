name: Release

# Structured Vibe releases are transactional: a full release and its tag exist
# only if the entire pipeline completes successfully (docs/specs/releasing.md).
#
# A human creates the release, which creates the tag and triggers this
# workflow. Any non-success conclusion the workflow can observe — step failure,
# manual cancellation, or job timeout — rolls back by deleting the release and
# its tag. Prereleases are exempt from that deletion and are retained instead,
# so a prerelease may exist without a successful pipeline and carries no
# completeness guarantee (docs/specs/release-rollback-coverage.md, D4).
#
# There is no tag-triggered workflow and no required workflow_dispatch step.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    # An explicit bound so a hung pipeline reaches a decision point long before
    # the six-hour default. Exceeding it cancels the job rather than failing it,
    # which is why the rollback guard below covers cancelled() as well.
    timeout-minutes: 30

    # One job, so rollback has a single failure surface to react to. Go cross
    # compiles, so a build matrix would add parallel failure paths without
    # buying anything.
    steps:
      - name: Identify release
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Validate version format
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # Plain SemVer with no "v" prefix.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$VERSION" | grep -Eq "$semver"; then
            echo "::error::release name '$VERSION' is not plain SemVer (no 'v' prefix)"
            exit 1
          fi

      # Checks out the commit the tag points at. If main has moved since the
      # release was created, this still builds the tagged commit.
      - name: Check out the exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Resolve exact commit
        id: commit
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building exactly $sha"

      # A successful check for a different commit is not sufficient.
      - name: Verify required validation for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusion=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')

          if [ "${conclusion:-0}" -lt 1 ]; then
            echo "::error::required CI has not succeeded for commit $SHA"
            echo "A successful run for a different commit does not count."
            exit 1
          fi
          echo "CI succeeded for $SHA"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/opencode/package-lock.json

      # Builds the OpenCode integration from source. It is part of the managed
      # payload, so it must exist before the manifest is verified.
      - name: Build OpenCode integration
        run: make plugin

      - name: Release validation
        run: |
          set -euo pipefail
          make generate-check
          make check

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make dist VERSION="$VERSION"

      - name: Verify artifact set
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make dist-verify VERSION="$VERSION"

      # Confirms the packaged binary reports the release version and passes its
      # own managed-integrity check against the payload shipped beside it.
      - name: Smoke test packaged artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tar -xzf "dist/svibe_${VERSION}_linux_amd64.tar.gz" -C "$work"
          root="$work/svibe_${VERSION}_linux_amd64"

          got=$("$root/svibe" --version)
          if [ "$got" != "$VERSION" ]; then
            echo "::error::packaged binary reports '$got', expected '$VERSION'"
            exit 1
          fi

          # Integrity is checked on every invocation. A missing managed file
          # already fails, but a modified one only warns, and manifest/payload
          # drift is exactly the bug packaging can introduce. So assert the
          # run is clean of managed warnings rather than trusting the exit
          # code alone.
          SVIBE_CONFIG_HOME="$root" "$root/svibe" validate --json > validate.json

          if grep -q '"managed\.' validate.json; then
            echo "::error::packaged payload does not match the embedded manifest"
            cat validate.json
            exit 1
          fi

          skills=$(grep -c '"path"' validate.json || true)
          if [ "${skills:-0}" -lt 1 ]; then
            echo "::error::packaged core pack resolved no skills"
            cat validate.json
            exit 1
          fi
          echo "packaged artifact verified"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION" \
            dist/svibe_"$VERSION"_*.tar.gz \
            dist/svibe_"$VERSION"_*.zip \
            dist/checksums.txt \
            --clobber

      # Rollback behavior itself lives in scripts/rollback-release.sh, which is
      # tested in internal/release (docs/specs/release-rollback-coverage.md, D3).
      # This step keeps only the guard, the bootstrap, and the call.
      #
      # The guard covers every non-success conclusion the workflow can observe.
      # cancelled() is required because GitHub does not run failure() steps when
      # a run is cancelled, and a job that exceeds timeout-minutes is cancelled
      # rather than failed, so manual cancellation, timeout, and runner
      # interruption would otherwise leave the release and tag published with no
      # successful pipeline behind them (D1).
      #
      # The step timeout is shorter than the job timeout and shorter than the
      # cancellation grace period, so a hanging rollback cannot outlive the
      # window in which it is allowed to run.
      #
      # The properties this step is required to preserve are asserted by
      # TestReleaseWorkflow* in internal/release, so a later edit cannot silently
      # narrow the guard, drop a timeout, route the inputs back through step
      # outputs, or make rollback depend on the checkout.
      - name: Roll back release and tag
        if: failure() || cancelled()
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Straight from the release event, never through a step output: a run
          # cancelled before "Identify release" completes has no step output to
          # read, and that is precisely the case this rollback exists to cover
          # (D3).
          VERSION: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # An immutable commit SHA. A movable reference such as the release tag
          # or a branch could be repointed between trigger and rollback; a SHA
          # cannot. github.sha would fetch identical bytes for this trigger --
          # nothing about the choice between them is load-bearing.
          SCRIPT_SHA: ${{ github.workflow_sha }}
        run: |
          set -uo pipefail

          echo "::warning::release pipeline reached a non-success conclusion; running rollback for $VERSION"

          script="$RUNNER_TEMP/rollback-release.sh"

          # Fetched from the contents API rather than read from the workspace.
          # Cancellation can happen before checkout completes, and version
          # validation fails before checkout even starts, so a script expected in
          # the workspace would be absent in exactly those cases and rollback
          # would degrade into a file-not-found failure (D3).
          if ! gh api \
            -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/scripts/rollback-release.sh?ref=$SCRIPT_SHA" \
            > "$script"; then
            echo "::error::could not fetch the rollback script at $SCRIPT_SHA; rollback did not run and the release or tag may still exist"
            exit 1
          fi

          if [ ! -s "$script" ]; then
            echo "::error::the rollback script fetched at $SCRIPT_SHA is empty; rollback did not run and the release or tag may still exist"
            exit 1
          fi

          # The script decides what to delete and what to retain, and reports a
          # retained prerelease on stdout, which is this run's own log.
          bash "$script" "$VERSION" "$PRERELEASE" "$REPO"
